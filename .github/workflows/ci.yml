name: Leaf issue 152 validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
        libgtk-3-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
      tools: ''
      dev-debug: '0'
      cache-save-on-dispatch: true
      cache-version: leaf-columns-v3
      timeout-minutes: 60
      command: |
        git fetch --no-tags https://github.com/frandavid100/wordcraft.git 4d1f272693542150398088179b7dee7f6687d3f8
        git checkout --detach 4d1f272693542150398088179b7dee7f6687d3f8
        echo "LEAF_152_TESTED_COMMIT $(git rev-parse HEAD)"
        cargo test -p wordcraft-doc -p wordcraft-engine --test empty_paragraph_merge
        cargo xtask ci

