name: Leaf issue 107 validation
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    uses: storytold/craft-common-actions/.github/workflows/gate.yml@main
    with:
      craft-fonts-ref: b076417b5880bd4154bd22f00695b1d28c6bea83
      packages: >-
        pkg-config libxkbcommon-dev libwayland-dev libx11-dev libxcursor-dev libxrandr-dev libxi-dev
        libgtk-3-dev libfontconfig1-dev libfreetype-dev mesa-vulkan-drivers
      tools: ''
      dev-debug: '0'
      cache-save-on-dispatch: true
      cache-version: leaf-columns-v3
      timeout-minutes: 60
      command: |
        git fetch --no-tags https://github.com/frandavid100/wordcraft.git 2f25b4e20d583a159e92caefe790674fc45126ea
        git checkout --detach 2f25b4e20d583a159e92caefe790674fc45126ea
        echo "LEAF_107_TESTED_COMMIT $(git rev-parse HEAD)"
        cargo test -p wordcraft-engine --lib a_picture_with_wrap_spacing_dropped_after_a_leading_break_stays_there
        cargo xtask ci
